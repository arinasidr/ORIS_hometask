<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список элементов:</title>
    <style>
        .card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            background-color: #f9f9f9;
        }
        .title {
            font-weight: bold;
            color: #2c3e50;
        }
        .desc {
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <h1>Список элементов</h1>

    {% if items %}
        <div class = "items-list">
            {% for x in items %}
                <div class = "card">
                    <div class = "title"> {{ x.title.capitalize() }} </div>
                    <div class = "desc"> {{ x.desc.capitalize() }} </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p>Список пуст.</p>
    {% endif %}

    <p><a href="{{ url_for('index') }}">Перейти на главную</a></p>
</body>
</html>
