<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Галерея</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 20px;
        background-color: #ede4ba;
      }
      h1 {
        margin-bottom: 20px;
        font-size: 40px;
      }

      h2 {
        font-size: 40px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
        gap: 20px;
        width: 100%;
        max-width: 900px;
      }

      .card {
        background: white;
        padding: 10px;
        border-radius: 10px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
        text-align: center;
      }

      .card img {
        width: 100%;
        height: auto;
        border-radius: 8px;
      }

      .caption {
        margin-top: -10px;
        font-size: 20px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h1>каталог фильмов ( ˙꒳​˙ )</h1>

    <div class="grid">
      {% for i in movie %}
      <div class="card">
        <h2>{{i.title}}</h2>
        <div class="caption">
          <p>год: {{ i.year }}</p>
          <p>рейтинг: {{ i.rating }}</p>
        </div>
      </div>
      {% endfor %}
    </div>
  </body>
</html>
