<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>калькулятор</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            background-color: #ede4ba;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 40px;
            color: #333;
            text-align: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
            margin-bottom: 30px;
        }

        .calculator-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .calc-form {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        input[type="number"] {
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            width: 120px;
            text-align: center;
            background-color: #f9f9f9;
            transition: border-color 0.3s ease;
        }

        select {
            padding: 15px 20px;
            font-size: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background-color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button[type="submit"] {
            padding: 15px 35px;
            font-size: 24px;
            background-color: #3a2901;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-weight: bold;
            margin-left: 10px;
        }

        button[type="submit"]:hover {
            background-color: #5a3d01;
        }

        .result {
            font-size: 40px;
            margin-top: 40px;
            padding: 20px;
            background-color: #f0f8ff;
            border-radius: 10px;
        }

        .error {
            margin-top: 25px;
            padding: 20px;
            background-color: #ffeaea;
            border-radius: 10px;
            border-left: 5px solid #e74c3c;
        }
    </style>
</head>
<body>
    <h1>калькулятор ＼(〇_ｏ)／ </h1>
    <div class="card">
        <form method="get" class="calc-form">
            <input type="number" step="any" name="a" placeholder="Число a" required>
            <select name="operation" required>
                <option value="+" selected>+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>
            <input type="number" step="any" name="b" placeholder="Число b" required>
            <button type="submit">=</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% elif result is not none %}
            <p class="result">{{ result }}</p>
        {% endif %}
    </div>
</body>
</html>
