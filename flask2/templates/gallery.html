<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8"/>
        <title>Галерея</title>

        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                margin: 0;
                padding: 20px;
                background-color: #ede4ba;
                
            }
            h1 {
                margin-bottom: 20px;
                font-size: 40px;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
                gap: 20px;
                width: 100%;
                max-width: 900px;
            }

            .card {
                background: white;
                padding: 10px;
                border-radius: 10px;
                box-shadow: 0 3px 8px rgba(0,0,0,0.3);
                text-align: center;
            }

            .card:hover {
                transform: scale(1.02);
            }
            .card img {
                width: 100%;
                height: auto;
                border-radius: 8px;
            }

             .caption {
                margin-top: 8px;
                font-size: 14px;
                color: #333;
            }
        </style>
    </head>
    <body>
        <h1>фоточки любимочек °˖✧◝(⁰▿⁰)◜✧˖° </h1>

        <div class="grid">
            {% for i in images %}
            <div class="card">
                <img src="{{ url_for('static', filename=i) }}" alt="{{ i }}">
                <div class="caption">{{ i }}</div>
            </div>
            {% endfor %}
        </div>
    </body>
</html>
